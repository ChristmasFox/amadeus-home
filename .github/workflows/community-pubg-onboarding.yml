name: Community PUBG Onboarding
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/init-pubg-team.mjs"
      - "scripts/init-community.mjs"
      - "scripts/test-init-community.mjs"
      - "infra/community/**"
      - "infra/docker/casaos/9router/patch-runtime-policy.mjs"
      - "infra/docker/casaos/9router/test-runtime-policy.mjs"
      - "scripts/test-init-pubg-team.mjs"
      - "scripts/check-community-fixtures.mjs"
      - "packages/pubg-domain/config/default-team.json"
      - ".github/workflows/community-pubg-onboarding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax
        run: |
          node --check scripts/init-pubg-team.mjs
          node --check scripts/test-init-pubg-team.mjs
          node --check scripts/check-community-fixtures.mjs
          node --check scripts/init-community.mjs
          node --check scripts/test-init-community.mjs
          node --check infra/docker/casaos/9router/patch-runtime-policy.mjs
          node --check infra/docker/casaos/9router/test-runtime-policy.mjs
      - name: Private team initializer (mocked API; no credentials)
        run: node --test scripts/test-init-pubg-team.mjs
      - name: Synthetic roster guard
        run: node scripts/check-community-fixtures.mjs
      - name: Community isolation and mocked initialization
        run: |
          node --test scripts/test-init-community.mjs
          node infra/docker/casaos/9router/test-runtime-policy.mjs
          node scripts/init-community.mjs --model fixture-model
          docker compose --env-file infra/community/.env -f infra/community/compose.yaml --profile pubg config --quiet
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const cfg=JSON.parse(readFileSync(".local/community-openclaw.json","utf8"));
            const pol=JSON.parse(readFileSync("infra/community/9router.runtime-policy.json","utf8"));
            if(pol.imageAccount!==null||cfg.channels.whatsapp.groupPolicy!=="disabled"||cfg.tools.profile!=="minimal") process.exit(1);
            const docker=readFileSync("infra/community/Dockerfile.9router","utf8");
            if(docker.includes("COPY infra/9router/runtime-policy.json")) process.exit(1);
            console.log("COMMUNITY_SECURITY_BOUNDARY=passed");
          '
