name: Read-Only Full Git History Privacy Audit
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/git-history-privacy-audit.yml"
      - "scripts/summarize-history-scan.mjs"
      - "scripts/audit-git-history-blobs.mjs"
      - "scripts/backup-git-history-before-rewrite.sh"
      - "scripts/rehearse-git-history-privacy.sh"
      - "docs/GIT_HISTORY_PRIVACY_REWRITE_REVIEW.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate local-only shell scripts
        run: |
          bash -n scripts/backup-git-history-before-rewrite.sh
          bash -n scripts/rehearse-git-history-privacy.sh
      - name: Read-only reachable-blob privacy analysis (no values)
        run: |
          node scripts/audit-git-history-blobs.mjs
          echo "REACHABLE_COMMIT_COUNT=$(git rev-list --all --count)"
          echo "TRACKED_REF_COUNT=$(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags | wc -l | tr -d ' ')"
      - name: Offline rewrite test using synthetic Git bundle only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages git-filter-repo
          export PATH="$HOME/.local/bin:$PATH"
          TMP="$(mktemp -d)"
          git init -q -b main "$TMP/src"
          git -C "$TMP/src" config user.name fixture
          git -C "$TMP/src" config user.email fixture@example.invalid
          mkdir -p "$TMP/src/infra/9router" "$TMP/src/scripts"
          printf '%s\n' 'demo-host.example.private.example' > "$TMP/src/README.md"
          printf '%s\n' 'demo-host.example.private.example' > "$TMP/src/scripts/runtime.sh"
          printf '%s\n' '{"email":"fixture@example.invalid"}' > "$TMP/src/infra/9router/runtime-policy.json"
          git -C "$TMP/src" add -A
          git -C "$TMP/src" commit -qm 'synthetic private policy fixture'
          git -C "$TMP/src" tag v1.10.4
          git -C "$TMP/src" bundle create "$TMP/source.bundle" --all
          printf '%s\n' 'literal:demo-host.example.private.example==>example.com' > "$TMP/rules.txt"
          AMADEUS_REWRITE_SOURCE_REPO="$TMP/src" \
            AMADEUS_REWRITE_OUTPUT_DIR="$TMP/out" \
            bash scripts/rehearse-git-history-privacy.sh "$TMP/source.bundle" "$TMP/rules.txt"
          git --git-dir="$TMP/out/rehearsal.git" show refs/heads/main:README.md | grep -Fqx example.com
          git --git-dir="$TMP/out/rehearsal.git" show refs/heads/main:scripts/runtime.sh | grep -Fqx demo-host.example.private.example
          if git --git-dir="$TMP/out/rehearsal.git" cat-file -e refs/heads/main:infra/9router/runtime-policy.json 2>/dev/null; then
            echo "Historical operator policy path still exists" >&2
            exit 1
          fi
          rm -rf "$TMP"
      - name: Gitleaks full-history scan — summary ONLY
        shell: bash
        run: |
          set -euo pipefail
          # No raw report, diff, match text, or token may be printed in public CI logs.
          set +e
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact=100 --log-opts='--all' \
            --report-format json --report-path /repo/.private-gitleaks-history.json . \
            > "$RUNNER_TEMP/gitleaks-hidden-output.txt" 2>&1
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "GITLEAKS_AUDIT_ERROR_EXIT=$code"
            rm -f .private-gitleaks-history.json "$RUNNER_TEMP/gitleaks-hidden-output.txt"
            exit "$code"
          fi
          node scripts/summarize-history-scan.mjs .private-gitleaks-history.json
          rm -f .private-gitleaks-history.json "$RUNNER_TEMP/gitleaks-hidden-output.txt"
          echo "NO_HISTORY_REWRITE_OR_FORCE_PUSH_PERFORMED=true"
