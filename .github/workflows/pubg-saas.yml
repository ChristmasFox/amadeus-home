name: PUBG SaaS (manual diagnostics)

# Gate only: Lab release scripts, Intelligence Lab experiments, documentation,
# and root lockfile updates do not justify a Gate build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pubg-saas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test
          POSTGRES_DB: pubg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pubg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PUBG_SAAS_TEST_DATABASE_URL: postgresql://postgres:ci-test@localhost:5432/pubg_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile --filter @agent/pubg-saas...
      - name: Build and verify Gate
        run: |
          pnpm check:secrets
          pnpm check:architecture
          pnpm build:pubg-saas
          pnpm typecheck:pubg-saas
          pnpm test:pubg-saas
