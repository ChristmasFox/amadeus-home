# CasaOS template. Copy to /var/lib/casaos/apps/product-radar/docker-compose.yml
# only after an explicit RELEASE apply. Secrets and admin recipients remain
# in an external env file.
services:
  product-radar:
    image: ${PRODUCT_RADAR_IMAGE:-local/product-radar:0.1.0}
    container_name: product-radar
    restart: unless-stopped
    networks:
      - radar_network
      - langbot_network
    environment:
      PRODUCT_RADAR_HOST: 0.0.0.0
      PRODUCT_RADAR_PORT: 5315
      PRODUCT_RADAR_DATABASE_PATH: /data/product-radar.sqlite
      PRODUCT_RADAR_WEBHOOK_URL: http://product-radar:5315/api/sensors/changedetection/webhook
      PRODUCT_RADAR_MAX_BODY_BYTES: ${PRODUCT_RADAR_MAX_BODY_BYTES:-16777216}
      PRODUCT_RADAR_API_KEY: ${PRODUCT_RADAR_API_KEY:-}
      CHANGEDETECTION_BASE_URL: http://changedetection:5000
      CHANGEDETECTION_API_KEY: ${CHANGEDETECTION_API_KEY:?restore outside Git}
      LANGBOT_API_BASE_URL: ${LANGBOT_API_BASE_URL:-http://langbot:5300}
      PRODUCT_RADAR_LANGBOT_API_HEADER: ${PRODUCT_RADAR_LANGBOT_API_HEADER:-X-API-Key}
      PRODUCT_RADAR_LANGBOT_API_TOKEN_FILE: /run/secrets/langbot-api-token
      TELEGRAM_ADMIN_USER_ID: ${TELEGRAM_ADMIN_USER_ID:-}
      KOOK_ADMIN_USER_ID: ${KOOK_ADMIN_USER_ID:-}
      PRODUCT_RADAR_TELEGRAM_BOT_ID: ${PRODUCT_RADAR_TELEGRAM_BOT_ID:-}
      PRODUCT_RADAR_KOOK_BOT_ID: ${PRODUCT_RADAR_KOOK_BOT_ID:-}
    ports:
      - "${PRODUCT_RADAR_PUBLIC_PORT:-5315}:5315"
    volumes:
      - /DATA/AppData/product-radar:/data
      - ${PRODUCT_RADAR_LANGBOT_API_TOKEN_HOST_FILE:-/DATA/AppData/product-radar/secrets/langbot-api-token}:/run/secrets/langbot-api-token:ro
    depends_on:
      changedetection:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5315/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.60.3
    container_name: changedetection
    restart: unless-stopped
    networks:
      - radar_network
    environment:
      PORT: 5000
    volumes:
      - /DATA/AppData/changedetection/datastore:/datastore
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/\", timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  radar_network:
    driver: bridge
  langbot_network:
    external: true
    name: langbot_langbot_network
