# CasaOS template. Copy to /var/lib/casaos/apps/product-radar/docker-compose.yml
# only after an explicit RELEASE apply. Secrets and admin recipients remain
# in an external env file. OpenClaw uses the shared Amadeus network only for
# the native Product Radar tool; notification delivery is an owner outbox.
services:
  product-radar:
    image: ${PRODUCT_RADAR_IMAGE:-local/product-radar:0.1.0}
    container_name: product-radar
    restart: unless-stopped
    networks:
      - radar_network
      - amadeus_network
    environment:
      PRODUCT_RADAR_HOST: 0.0.0.0
      PRODUCT_RADAR_PORT: 5315
      PRODUCT_RADAR_DATABASE_PATH: /data/product-radar.sqlite
      PRODUCT_RADAR_WEBHOOK_URL: http://product-radar:5315/api/sensors/changedetection/webhook
      PRODUCT_RADAR_MAX_BODY_BYTES: ${PRODUCT_RADAR_MAX_BODY_BYTES:-16777216}
      PRODUCT_RADAR_API_KEY: ${PRODUCT_RADAR_API_KEY:-}
      PRODUCT_RADAR_IMAGE_MATCHER_PROVIDER: ${PRODUCT_RADAR_IMAGE_MATCHER_PROVIDER:-hybrid}
      FASHION_SIGLIP_BASE_URL: ${FASHION_SIGLIP_BASE_URL:-http://host.docker.internal:18400}
      FASHION_SIGLIP_TIMEOUT_MS: ${FASHION_SIGLIP_TIMEOUT_MS:-60000}
      CHANGEDETECTION_BASE_URL: http://changedetection:5000
      CHANGEDETECTION_API_KEY: ${CHANGEDETECTION_API_KEY:?restore outside Git}
      OWNER_NOTIFICATION_OUTBOX_DIR: /notifications
    ports:
      - "${PRODUCT_RADAR_PUBLIC_PORT:-5315}:5315"
    volumes:
      - /DATA/AppData/product-radar:/data
      - ${OPENCLAW_OWNER_OUTBOX_HOST_DIR:-/DATA/AppData/openclaw/notifications}:/notifications
    depends_on:
      changedetection:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5315/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.60.3
    container_name: changedetection
    restart: unless-stopped
    networks:
      - radar_network
    environment:
      PORT: 5000
    volumes:
      - /DATA/AppData/changedetection/datastore:/datastore
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/\", timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  radar_network:
    driver: bridge
  amadeus_network:
    external: true
    name: ${AMADEUS_NETWORK_NAME:-amadeus_network}
