# Lab web_search backend. Private to amadeus_network; never published on the host.
# secret_key comes from the SEARXNG_SECRET env var (generated on the guest, not in Git).
use_default_settings: true
general:
  instance_name: "Lab SearXNG"
  enable_metrics: false
search:
  safe_search: 0
  formats:
    - html
    - json
server:
  limiter: false
  public_instance: false
  image_proxy: false
outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  proxies:
    all://:
      - http://host.docker.internal:7897
