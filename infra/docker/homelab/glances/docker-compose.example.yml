name: glances

services:
  glances:
    image: ${GLANCES_IMAGE:-nicolargo/glances:latest}
    container_name: glances
    hostname: glances
    restart: unless-stopped
    pid: host
    command: ["glances", "-w", "-B", "0.0.0.0"]
    ports:
      - "${GLANCES_PORT:-61208}:61208/tcp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    x-casaos:
      author: self
      category: System
      port_map: "61208"
      scheme: http
      title:
        custom: Glances
