name: qbittorrent

services:
  qbittorrent:
    image: ${QBITTORRENT_IMAGE:-lscr.io/linuxserver/qbittorrent:latest}
    container_name: qbittorrent
    hostname: qbittorrent
    restart: unless-stopped
    environment:
      PUID: ${QBITTORRENT_PUID:-1000}
      PGID: ${QBITTORRENT_PGID:-1000}
      TZ: Asia/Shanghai
      WEBUI_PORT: ${QBITTORRENT_WEBUI_PORT:-8080}
      TORRENTING_PORT: ${QBITTORRENT_TORRENTING_PORT:-6881}
    ports:
      - "${QBITTORRENT_WEBUI_PORT:-8080}:8080/tcp"
      - "${QBITTORRENT_TORRENTING_PORT:-6881}:6881/tcp"
      - "${QBITTORRENT_TORRENTING_PORT:-6881}:6881/udp"
    volumes:
      - ${QBITTORRENT_CONFIG_DIR:-/DATA/AppData/qbittorrent/config}:/config
      - ${QBITTORRENT_DOWNLOAD_DIR:-/Volumes/Avalon/downloads/complete}:/downloads
      - ${QBITTORRENT_INCOMPLETE_DIR:-/Volumes/Avalon/downloads/incomplete}:/downloads/incomplete
    x-casaos:
      author: self
      category: Download
      port_map: "8080"
      scheme: http
      title:
        custom: qBittorrent
