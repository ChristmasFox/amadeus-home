name: 9router

services:
  9router:
    image: ${NINE_ROUTER_IMAGE:-local/9router:0.5.81}
    container_name: 9router
    restart: unless-stopped
    env_file:
      - ${NINE_ROUTER_ENV_FILE:-/DATA/AppData/9router/9router.env}
    logging:
      driver: ${DOCKER_LOG_DRIVER:-local}
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "20128"
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATA_DIR: /app/data
      BASE_URL: ${NINE_ROUTER_BASE_URL:-http://127.0.0.1:20128}
      NEXT_PUBLIC_BASE_URL: ${NINE_ROUTER_BASE_URL:-http://127.0.0.1:20128}
      CLOUD_URL: https://9router.com
      NEXT_PUBLIC_CLOUD_URL: https://9router.com
      REQUIRE_API_KEY: ${NINE_ROUTER_REQUIRE_API_KEY:-true}
      AUTH_COOKIE_SECURE: "false"
      OBSERVABILITY_ENABLED: "true"
      ENABLE_REQUEST_LOGS: "false"
    ports:
      - "${NINE_ROUTER_PORT:-20128}:20128"
    volumes:
      - ${NINE_ROUTER_DATA_DIR:-/DATA/AppData/9router/data}:/app/data
    x-casaos:
      author: self
      category: Developer
      port_map: "20128"
      scheme: http
      title:
        custom: 9router
