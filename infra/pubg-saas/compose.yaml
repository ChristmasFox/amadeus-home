name: ${PUBG_SAAS_COMPOSE_PROJECT:-pubg-saas}

services:
  postgres:
    image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
    restart: unless-stopped
    environment:
      POSTGRES_DB: pubg_saas
      POSTGRES_USER: pubg_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/pubg_postgres_superuser_password
    secrets:
      - pubg_postgres_superuser_password
      - pubg_app_password
      - pubg_migrator_password
      - pubg_backup_password
    volumes:
      - pubg_saas_postgres_data:/var/lib/postgresql
      - ./postgres-init/10-pubg-roles.sh:/docker-entrypoint-initdb.d/10-pubg-roles.sh:ro
    ports:
      - "127.0.0.1:${PUBG_SAAS_BACKUP_PG_PORT:-55433}:5432"
    networks:
      - postgres_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubg_bootstrap -d pubg_saas"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    logging: &bounded_logs
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  migrate:
    image: ${PUBG_SAAS_IMAGE:?Set an immutable image tag built from this Git checkout}
    profiles: [ops]
    restart: "no"
    env_file:
      - ./secrets/migrator.env
    secrets:
      - pubg_migrator_password
    command: ["node", "dist/src/migrate-database.js", "--apply"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres_private
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging: *bounded_logs

  egress-proxy:
    image: ${PUBG_SAAS_IMAGE:?Set an immutable image tag built from this Git checkout}
    restart: unless-stopped
    entrypoint: ["node"]
    command: ["dist/src/infrastructure/egress-proxy.js"]
    environment:
      PUBG_SAAS_EGRESS_METRICS_PORT: "9465"
    ports:
      - "127.0.0.1:${PUBG_SAAS_WORKER_METRICS_PORT:-9464}:9465"
    networks:
      - egress_internal
      - public_egress
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const s=require('node:net').connect(8080,'127.0.0.1');s.once('connect',()=>{s.destroy();process.exit(0)});s.once('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 3s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: *bounded_logs

  gateway:
    image: ${PUBG_SAAS_IMAGE:?Set an immutable image tag built from this Git checkout}
    restart: unless-stopped
    init: true
    env_file:
      - ./secrets/gateway.env
    environment:
      PUBG_SAAS_EGRESS_PROXY: http://egress-proxy:8080
      PUBG_SAAS_EGRESS_PROXY_REQUIRED: "1"
    secrets:
      - pubg_app_password
    command: ["node", "dist/src/gateway.js", "--apply"]
    depends_on:
      postgres:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    networks:
      - postgres_private
      - egress_internal
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    logging: *bounded_logs

  worker:
    image: ${PUBG_SAAS_IMAGE:?Set an immutable image tag built from this Git checkout}
    restart: unless-stopped
    init: true
    env_file:
      - ./secrets/worker.env
    environment:
      PUBG_SAAS_EGRESS_PROXY: http://egress-proxy:8080
      PUBG_SAAS_EGRESS_PROXY_REQUIRED: "1"
      PUBG_SAAS_WORKER_METRICS_PORT: "9464"
      PUBLIC_SYNC_INTERVAL_MS: "300000" # Matches the private plugin's configured five-minute freshness.
      PUBLIC_SYNC_MAX_MATCHES: "500" # Matches the private PUBG plugin's configured maxMatches.
      PUBLIC_SYNC_MAX_TELEMETRY_FETCHES: "20" # Matches the shared Domain prefetch default.
      PUBLIC_SYNC_TEAM_CONCURRENCY: "2" # Keep the worker scheduler at its code default.
    secrets:
      - pubg_app_password
    command: ["node", "dist/src/public-sync-worker.js", "--apply"]
    depends_on:
      postgres:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    networks:
      - postgres_private
      - egress_internal
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 128
    logging: *bounded_logs

networks:
  postgres_private:
    internal: true
  egress_internal:
    internal: true
  public_egress:
    driver: bridge

volumes:
  pubg_saas_postgres_data:

secrets:
  pubg_postgres_superuser_password:
    file: ./secrets/postgres-superuser-password
  pubg_app_password:
    file: ./secrets/app-password
  pubg_migrator_password:
    file: ./secrets/migrator-password
  pubg_backup_password:
    file: ./secrets/backup-password
