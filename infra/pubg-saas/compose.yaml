name: ${PUBG_SAAS_COMPOSE_PROJECT:-pubg-saas}

services:
  postgres:
    image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
    restart: unless-stopped
    environment:
      POSTGRES_DB: pubg_saas
      POSTGRES_USER: pubg_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/pubg_postgres_superuser_password
    secrets:
      - pubg_postgres_superuser_password
      - pubg_app_password
      - pubg_migrator_password
      - pubg_backup_password
    volumes:
      - pubg_saas_postgres_data:/var/lib/postgresql
      - ./postgres-init/10-pubg-roles.sh:/docker-entrypoint-initdb.d/10-pubg-roles.sh:ro
    ports:
      - "127.0.0.1:${PUBG_SAAS_BACKUP_PG_PORT:-55433}:5432"
    networks:
      - postgres_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubg_bootstrap -d pubg_saas"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    logging: &bounded_logs
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  migrate:
    image: ${PUBG_SAAS_IMAGE:?Set an immutable image tag built from this Git checkout}
    profiles: [ops]
    restart: "no"
    env_file:
      - ./secrets/migrator.env
    secrets:
      - pubg_migrator_password
    command: ["node", "dist/src/migrate-database.js", "--apply"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres_private
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging: *bounded_logs

  gateway:
    image: ${PUBG_SAAS_IMAGE:?Set an immutable image tag built from this Git checkout}
    restart: unless-stopped
    init: true
    env_file:
      - ./secrets/gateway.env
    secrets:
      - pubg_app_password
    command: ["node", "dist/src/gateway.js", "--apply"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres_private
      - public_egress
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    logging: *bounded_logs

  worker:
    image: ${PUBG_SAAS_IMAGE:?Set an immutable image tag built from this Git checkout}
    restart: unless-stopped
    init: true
    env_file:
      - ./secrets/worker.env
    secrets:
      - pubg_app_password
    command: ["node", "dist/src/public-sync-worker.js", "--apply"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres_private
      - public_egress
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 128
    logging: *bounded_logs

networks:
  postgres_private:
    internal: true
  public_egress:
    driver: bridge

volumes:
  pubg_saas_postgres_data:

secrets:
  pubg_postgres_superuser_password:
    file: ./secrets/postgres-superuser-password
  pubg_app_password:
    file: ./secrets/app-password
  pubg_migrator_password:
    file: ./secrets/migrator-password
  pubg_backup_password:
    file: ./secrets/backup-password
