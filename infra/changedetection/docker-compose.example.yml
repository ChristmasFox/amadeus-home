# Canonical changedetection.io service template. Keep this service on the
# internal CasaOS network with Product Radar; do not publish port 5000 publicly.
services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.60.3
    container_name: changedetection
    restart: unless-stopped
    environment:
      PORT: 5000
    volumes:
      - /DATA/AppData/changedetection/datastore:/datastore
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
