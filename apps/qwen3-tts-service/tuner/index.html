<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kurisu TTS Tuner</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header><div><p class="eyebrow">AMADEUS · OWNER LOCAL</p><h1>Kurisu TTS Tuner</h1></div><div id="health" class="badge">loading…</div></header>
    <section class="facts" id="facts"></section>
    <section class="panel">
      <div class="section-title"><h2>Test text</h2><span id="count">0 / 1200</span></div>
      <textarea id="text" maxlength="1200" lang="ja">ねえ、そこまで無理をしなくてもいいんじゃない？　……べ、別に心配しているわけじゃないから。</textarea>
      <p class="hint" id="textHint">40–90 Japanese characters is a useful routine comparison range.</p>
    </section>
    <section class="panel grid2">
      <div><div class="section-title"><h2>Style editor</h2><select id="emotion"></select></div>
        <label>Candidate baseline<textarea id="baseline"></textarea></label>
        <label>Emotion delta<textarea id="delta"></textarea></label>
        <label>Effective instruct preview<textarea id="effective" readonly></textarea></label>
        <button id="reset">Reset candidate to PROD</button>
      </div>
      <div><div class="section-title"><h2>Experiment</h2><select id="mode"><option>STYLE ONLY</option><option>SAMPLING</option><option>VARIANCE</option><option>FREE COMPARE</option></select></div>
        <div class="locks"><label><input type="checkbox" id="lockText" checked> Lock text</label><label><input type="checkbox" id="lockStyle" checked> Lock style</label><label><input type="checkbox" id="lockSeed" checked> Lock seed</label><label><input type="checkbox" id="lockSampling" checked> Lock sampling</label><label><input type="checkbox" id="lockSpeed" checked> Lock speed</label></div>
        <div id="controls" class="controls"></div>
        <div class="identity"><b>Locked identity</b><span>OminiX Base 1.7B · kurisu-v1 x-vector · Japanese</span></div>
      </div>
    </section>
    <section class="panel"><div class="section-title"><h2>Comparison slots</h2><span id="compareState"></span></div><div id="slots" class="slots"></div><div class="actions"><button class="primary" id="generate">Generate selected sequentially</button><button id="draft">Save Draft</button><button id="proposal">Create Production Proposal</button></div></section>
    <section class="panel"><div class="section-title"><h2>Results</h2><button id="refresh">Refresh history</button></div><div id="results" class="results"></div></section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
