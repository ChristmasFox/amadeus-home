services:
  product-radar:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/product-radar:0.1.0
    restart: unless-stopped
    networks:
      - radar_network
      - langbot_network
    environment:
      PRODUCT_RADAR_HOST: 0.0.0.0
      PRODUCT_RADAR_PORT: 5315
      PRODUCT_RADAR_DATABASE_PATH: /data/product-radar.sqlite
      PRODUCT_RADAR_WEBHOOK_URL: http://product-radar:5315/api/sensors/changedetection/webhook
      PRODUCT_RADAR_API_KEY: ${PRODUCT_RADAR_API_KEY:-}
      CHANGEDETECTION_BASE_URL: http://changedetection:5000
      CHANGEDETECTION_API_KEY: ${CHANGEDETECTION_API_KEY:-}
      LANGBOT_API_BASE_URL: ${LANGBOT_API_BASE_URL:-http://langbot:5300}
      PRODUCT_RADAR_LANGBOT_API_HEADER: ${PRODUCT_RADAR_LANGBOT_API_HEADER:-X-API-Key}
      PRODUCT_RADAR_LANGBOT_API_TOKEN_FILE: ${PRODUCT_RADAR_LANGBOT_API_TOKEN_FILE:-}
      TELEGRAM_ADMIN_USER_ID: ${TELEGRAM_ADMIN_USER_ID:-}
      KOOK_ADMIN_USER_ID: ${KOOK_ADMIN_USER_ID:-}
      PRODUCT_RADAR_TELEGRAM_BOT_ID: ${PRODUCT_RADAR_TELEGRAM_BOT_ID:-}
      PRODUCT_RADAR_KOOK_BOT_ID: ${PRODUCT_RADAR_KOOK_BOT_ID:-}
    ports:
      - "${PRODUCT_RADAR_PORT:-5315}:5315"
    volumes:
      - product-radar-data:/data
    depends_on:
      changedetection:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5315/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.60.3
    restart: unless-stopped
    networks:
      - radar_network
    environment:
      PORT: 5000
    volumes:
      - changedetection-data:/datastore
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  radar_network:
    driver: bridge
  langbot_network:
    driver: bridge

volumes:
  product-radar-data:
  changedetection-data:
