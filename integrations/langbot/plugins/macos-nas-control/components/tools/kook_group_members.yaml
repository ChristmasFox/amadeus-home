apiVersion: v1
kind: Tool
metadata:
  name: kook_group_members
  label:
    en_US: KOOK Group Members
    zh_Hans: KOOK 群成员
  description:
    en_US: List members of the current KOOK server.
    zh_Hans: 查询当前 KOOK 服务器的成员列表。
spec:
  parameters:
    type: object
    properties:
      max_members:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
        description: Maximum number of members to display.
  llm_prompt: Use this tool when the user asks who is in the current KOOK server or asks for the current server member list. Only use the current server context; do not claim member information without calling this tool.
execution:
  python:
    path: kook_group_members.py
    attr: KookGroupMembersTool
