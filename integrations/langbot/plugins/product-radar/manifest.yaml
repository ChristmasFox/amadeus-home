apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: product-radar
  repository: ''
  version: 0.5.8
  description:
    en_US: Generic natural-language intent bridge for Product Radar visual, seller, and product watches.
      zh_Hans: Product Radar 图片寻货、卖家监控与商品监控的通用自然语言入口，支持 JSON 语义解析、Bunjang 默认 source、LangBot 模型选择、LangBot Message 结果解析、编号选择、按钮取消、状态查询兜底和跨领域路由隔离。
  label:
    en_US: Product Radar 0.5.7
      zh_Hans: Product Radar 0.5.8
spec:
  config:
  - name: model_uuid
    label:
      en_US: Product Radar LLM model
      zh_Hans: Product Radar 语义与图片模型
    description:
      en_US: Select the LangBot model for Product Radar intent parsing and multimodal TargetProfile extraction. Leave empty to use the first available LangBot model. Image watches require a vision-capable model.
      zh_Hans: 选择 Product Radar 的 LangBot 语义解析与多模态 TargetProfile 模型。留空时使用 LangBot 返回的首个可用模型；图片监控必须选择支持 vision 的模型。
    type: llm-model-selector
    required: false
    default: ''
  components:
    EventListener:
      fromDirs:
      - path: components/listeners/
        maxDepth: 1
    Command:
      fromDirs:
      - path: components/commands/
        maxDepth: 1
  pages: []
execution:
  python:
    path: main.py
    attr: ProductRadarPlugin
