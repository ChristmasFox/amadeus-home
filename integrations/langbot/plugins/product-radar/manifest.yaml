apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: product-radar
  repository: ''
  version: 0.1.0
  description:
    en_US: Natural-language Seller Watch and Product Watch bridge for Product Radar.
    zh_Hans: Product Radar 卖家监控与商品监控的自然语言入口。
  label:
    en_US: Product Radar 0.1.0
    zh_Hans: Product Radar 0.1.0
spec:
  config: []
  components:
    EventListener:
      fromDirs:
      - path: components/listeners/
        maxDepth: 1
    Command:
      fromDirs:
      - path: components/commands/
        maxDepth: 1
  pages: []
execution:
  python:
    path: main.py
    attr: ProductRadarPlugin
