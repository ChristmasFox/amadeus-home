apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: product-radar
  repository: ''
  version: 0.6.0
  description:
    en_US: Deterministic Product Radar command adapter; natural-language watch requests use the LangBot native Agent and Kurisu.
    zh_Hans: Product Radar 确定性命令适配；普通自然语言监控请求统一经 LangBot 原生 Agent 与 Kurisu 处理。
  label:
    en_US: Product Radar 0.6.0
    zh_Hans: Product Radar 0.6.0
spec:
  config:
  - name: model_uuid
    label:
      en_US: Product Radar LLM model
      zh_Hans: Product Radar 语义与图片模型
    description:
      en_US: Select the LangBot model for Product Radar intent parsing and multimodal TargetProfile extraction. Leave empty to use the first available LangBot model. Image watches require a vision-capable model.
      zh_Hans: 选择 Product Radar 的 LangBot 语义解析与多模态 TargetProfile 模型。留空时使用 LangBot 返回的首个可用模型；图片监控必须选择支持 vision 的模型。
    type: llm-model-selector
    required: false
    default: ''
  components:
    Command:
      fromDirs:
      - path: components/commands/
        maxDepth: 1
  pages: []
execution:
  python:
    path: main.py
    attr: ProductRadarPlugin
