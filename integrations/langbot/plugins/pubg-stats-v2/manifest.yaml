apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: pubg-stats
  repository: ''
  version: 2.0.1
  description:
    en_US: Query PUBG squad statistics and period-based fun rankings through n8n.
    zh_Hans: 通过 n8n 查询 PUBG 小队战绩及指定周期内的趣味排名。
  label:
    en_US: PUBG Stats
    zh_Hans: PUBG 战绩
spec:
  config: []
  components:
    EventListener:
      fromDirs:
      - path: components/listeners/
        maxDepth: 1
    Command:
      fromDirs:
      - path: components/commands/
        maxDepth: 1
    Tool:
      fromDirs:
      - path: components/tools/
        maxDepth: 1
  pages: []
execution:
  python:
    path: main.py
    attr: PubgStatsPlugin
