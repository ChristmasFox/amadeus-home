apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: organize-emby
  repository: ''
  version: 0.2.0
  description:
    en_US: Organize one explicitly selected Emby TV download folder.
    zh_Hans: 整理用户明确选择的 Emby 电视剧下载文件夹。
  label:
    en_US: Organize Emby Media
    zh_Hans: 整理 Emby 媒体
spec:
  config: []
  components:
    Command:
      fromDirs:
        - path: components/commands/
          maxDepth: 1
    Tool:
      fromDirs:
        - path: components/tools/
          maxDepth: 1
execution:
  python:
    path: main.py
    attr: OrganizeEmbyPlugin
