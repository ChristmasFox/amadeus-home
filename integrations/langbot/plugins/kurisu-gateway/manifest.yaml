apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: kurisu-gateway
  repository: ''
  version: 0.1.4
  description:
    en_US: Structured Kurisu tools for the existing LangBot native Agent.
    zh_Hans: 为现有 LangBot 原生主 Agent 提供结构化 Kurisu 工具；不监听自然语言事件。
  label:
    en_US: Kurisu Gateway 0.1.4
    zh_Hans: Kurisu 统一工具网关 0.1.4
spec:
  config:
  - name: runtime_url
    label:
      en_US: Kurisu runtime URL
      zh_Hans: Kurisu runtime 地址
    description:
      en_US: Internal structured-tool service URL. Keep it on the private network.
      zh_Hans: 内部结构化工具服务地址，仅允许私有网络。
    type: string
    required: false
    default: http://pubg-query-engine-v3:5310
  components:
    Tool:
      fromDirs:
      - path: components/tools/
        maxDepth: 1
  pages: []
execution:
  python:
    path: main.py
    attr: KurisuGatewayPlugin
