apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: pubg-stats
  repository: ''
  version: 3.2.3
  description:
    en_US: Platform-independent PUBG Query Engine v3.2 bridge with Telegram and WhatsApp text messaging.
    zh_Hans: 支持 Telegram 与 WhatsApp 文本消息及对局复盘的平台无关 PUBG Query Engine v3.2 桥接插件。
  label:
    en_US: PUBG Stats v3.2.3
    zh_Hans: PUBG 战绩 v3.2.3
spec:
  config: []
  components:
    EventListener:
      fromDirs:
      - path: components/listeners/
        maxDepth: 1
    Command:
      fromDirs:
      - path: components/commands/
        maxDepth: 1
    Tool:
      fromDirs:
      - path: components/tools/
        maxDepth: 1
  pages: []
execution:
  python:
    path: main.py
    attr: PubgStatsV3Plugin
