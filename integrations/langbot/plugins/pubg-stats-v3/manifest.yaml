apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: pubg-stats
  repository: ''
  version: 3.3.3
  description:
    en_US: Deterministic PUBG protocol commands and tools for the LangBot native Agent; natural-language messages use Kurisu.
    zh_Hans: 为 LangBot 原生 Agent 保留确定性 PUBG 协议命令和工具；普通自然语言统一经 Kurisu 处理。
  label:
    en_US: PUBG Stats v3.3.3
    zh_Hans: PUBG 战绩 v3.3.3
spec:
  config: []
  components:
    Command:
      fromDirs:
      - path: components/commands/
        maxDepth: 1
    Tool:
      fromDirs:
      - path: components/tools/
        maxDepth: 1
  pages: []
execution:
  python:
    path: main.py
    attr: PubgStatsV3Plugin
