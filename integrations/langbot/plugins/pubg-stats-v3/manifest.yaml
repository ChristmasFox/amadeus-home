apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: pubg-stats
  repository: ''
  version: 3.2.4
  description:
    en_US: Platform-independent PUBG Query Engine v3.2 bridge with Telegram, KOOK, WhatsApp, and read-only identity inspection.
    zh_Hans: 支持 Telegram、KOOK、WhatsApp 文本消息、对局复盘和只读身份查询的平台无关 PUBG Query Engine v3.2 桥接插件。
  label:
    en_US: PUBG Stats v3.2.4
    zh_Hans: PUBG 战绩 v3.2.4
spec:
  config: []
  components:
    EventListener:
      fromDirs:
      - path: components/listeners/
        maxDepth: 1
    Command:
      fromDirs:
      - path: components/commands/
        maxDepth: 1
    Tool:
      fromDirs:
      - path: components/tools/
        maxDepth: 1
  pages: []
execution:
  python:
    path: main.py
    attr: PubgStatsV3Plugin
