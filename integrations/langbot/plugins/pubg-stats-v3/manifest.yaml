apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: pubg-stats
  repository: ''
  version: 3.3.4
  description:
    en_US: Deterministic PUBG protocol commands for LangBot; ordinary natural-language messages use Kurisu.
    zh_Hans: 为 LangBot 保留确定性 PUBG 协议命令；普通自然语言统一经 Kurisu 处理。
  label:
    en_US: PUBG Stats v3.3.4
    zh_Hans: PUBG 战绩 v3.3.4
spec:
  config: []
  components:
    Command:
      fromDirs:
      - path: components/commands/
        maxDepth: 1
  pages: []
execution:
  python:
    path: main.py
    attr: PubgStatsV3Plugin
